name: Rebuild

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  rebuild:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Python 2 via pyenv
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev \
              libbz2-dev libreadline-dev libsqlite3-dev wget curl llvm \
              libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev libffi-dev liblzma-dev
          curl https://pyenv.run | bash
          echo 'export PYENV_ROOT="$HOME/.pyenv"' >> $GITHUB_ENV
          echo 'export PATH="$PYENV_ROOT/bin:$PATH"' >> $GITHUB_ENV
          echo 'eval "$(pyenv init --path)"' >> $GITHUB_ENV
          echo 'eval "$(pyenv init -)"' >> $GITHUB_ENV
          echo 'eval "$(pyenv virtualenv-init -)"' >> $GITHUB_ENV

      - name: Set up Python 2
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init --path)"
          eval "$(pyenv init -)"
          eval "$(pyenv virtualenv-init -)"
          pyenv install 2.7.18
          pyenv global 2.7.18
          python2 --version

      - name: Rebuild
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init --path)"
          eval "$(pyenv init -)"
          eval "$(pyenv virtualenv-init -)"
          npm install
          npm run translate

      - name: Upload built-dist
        uses: actions/upload-artifact@v4
        with:
          name: built-dist
          path: dist

      - name: Upload built-media
        uses: actions/upload-artifact@v4
        with:
          name: built-media
          path: media

      - name: Checkout to develop-builds
        uses: actions/checkout@v3
        with:
          ref: develop-builds
          fetch-depth: 0

      - name: Clear out things
        run: |
          rm -rf dist/*
          rm -rf media/*

      - name: Download built-dist
        uses: actions/download-artifact@v4
        with:
          name: built-dist
          path: dist/

      - name: Download built-media
        uses: actions/download-artifact@v4
        with:
          name: built-media
          path: media/

      - name: Commit
        uses: EndBug/add-and-commit@v9.1.1
        with:
          message: "Build"
          committer_name: GitHub Actions
          committer_email: actions@github.com
